# 项目工具配置（CI 与本地共用同一份，避免两边口径不一致）

[tool.pytest.ini_options]
testpaths = ["src/test"]
# 手工联调脚本（需真实 MCP / DeepSeek Key / ERP 后端）放在 scripts/manual/，不在
# testpaths 里，因而不需要逐个 --ignore：新增同类脚本默认不会被收集。
markers = [
    "integration: 需要 Docker / MongoDB / 真实模型等外部依赖，CI 不跑",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 骨架阶段只拦“一定会出错”的问题：语法错误、未定义名称、调试残留。
# 等存量代码清理后再逐步放开 E/W/I/UP 等规则，否则第一天就是 472 条报错。
select = ["E9", "F63", "F7", "F82"]
