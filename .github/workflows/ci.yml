name: CI

# 触发：所有分支的推送 + 所有 PR（含来自 fork 的 PR）
on:
  push:
  pull_request:

# 同一分支连续推送时取消上一次运行，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-observability.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-observability.txt
          pip install pytest ruff

      - name: Lint (ruff)
        run: python scripts/dev.py lint

      - name: Unit tests (pytest)
        # 沙箱容器、MongoDB、真实模型都不在 CI 里，只跑离线可复现的用例。
        # 需要外部依赖的脚本已在 pyproject.toml 的 addopts 里排除。
        run: python scripts/dev.py test

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
